name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          ZIP=$(ls *.zip | head -n1)
          unzip -q "$ZIP" -d _src
          D=$(dirname "$(find _src -name settings.gradle | head -n1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QSGlass-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
